[project]
name = "makeitalive"
version = "0.1.0"
description = "Animating static landscape photos into short videos with Motion Flow warping and fine-tuned Stable Video Diffusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.1.1",
    "scipy>=1.15.3",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "yt-dlp>=2026.3.3",
]

[project.optional-dependencies]
svd = [
    "diffusers",
    "transformers",
    "accelerate",
    "peft",
    "imageio[ffmpeg]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
